[package]
name = "sl-factory"
version = "0.1.0"
edition = "2021"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.9.0"

[dev-dependencies]
near-workspaces = "0.24"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
near-sdk = { version = "5.9.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
