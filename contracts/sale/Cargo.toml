[package]
name = "sealed-sale"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SealedLaunch sale + NEP-141 token contract"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1" }
near-contract-standards = "=5.30.1"
sealed-clearing = { path = "../../clearing" }

[dev-dependencies]
near-workspaces = { version = "=0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
