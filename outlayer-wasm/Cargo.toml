[package]
name = "sl-worker"
version = "0.1.0"
edition = "2021"
description = "SealedLaunch OutLayer TEE worker (derive_pubkey, clear)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sl-worker"
path = "src/main.rs"

[dependencies]
sealed-clearing = { path = "../clearing" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
base64 = "0.22"
ecies = { version = "0.2", default-features = false, features = ["pure"] }
libsecp256k1 = "0.7"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

[target.'cfg(not(target_family = "wasm"))'.dependencies]
critical-section = { version = "1", features = ["std"] }
