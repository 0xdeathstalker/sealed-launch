[package]
name = "sealed-clearing"
version = "0.1.0"
edition = "2021"
description = "SealedLaunch uniform-price clearing + allocation Merkle tree (no_std + alloc)"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
